<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">OVRS runtime data flow</title>
  <desc id="desc">Infrared frames and motion samples pass through owned bounded queues, synchronization, ordered dispatch, OpenVINS propagation and updates, then trajectory outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0 0L10 3L0 6Z" fill="#5f7f99"/>
    </marker>
    <style>
      .box { fill: #f7fbfe; stroke: #34566f; stroke-width: 2; }
      .sensor { fill: #e7f7f3; stroke: #238d7d; stroke-width: 2; }
      .filter { fill: #edf3ff; stroke: #4e75bd; stroke-width: 2; }
      .output { fill: #fff6de; stroke: #b27c16; stroke-width: 2; }
      .guard { fill: #fff0f0; stroke: #bd5656; stroke-width: 2; }
      .label { fill: #173044; font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; }
      .small { fill: #3f596b; font-family: Arial, sans-serif; font-size: 15px; }
      .line { fill: none; stroke: #5f7f99; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="620" rx="24" fill="#f0f5f8"/>
  <text x="700" y="48" text-anchor="middle" class="label" font-size="28">Deterministic runtime pipeline</text>

  <g transform="translate(40 100)">
    <rect class="sensor" width="190" height="92" rx="16"/>
    <text x="95" y="38" text-anchor="middle" class="label">IR1 + IR2</text>
    <text x="95" y="65" text-anchor="middle" class="small">848×480 Y8 @ 30 Hz</text>
  </g>
  <g transform="translate(40 300)">
    <rect class="sensor" width="190" height="112" rx="16"/>
    <text x="95" y="35" text-anchor="middle" class="label">D435i IMU</text>
    <text x="95" y="65" text-anchor="middle" class="small">gyro 200 Hz</text>
    <text x="95" y="89" text-anchor="middle" class="small">accel 250 Hz</text>
  </g>

  <g transform="translate(290 92)">
    <rect class="box" width="220" height="108" rx="16"/>
    <text x="110" y="35" text-anchor="middle" class="label">Callback</text>
    <text x="110" y="63" text-anchor="middle" class="small">copy each Y8 frame once</text>
    <text x="110" y="86" text-anchor="middle" class="small">enqueue only</text>
  </g>
  <g transform="translate(290 292)">
    <rect class="box" width="220" height="128" rx="16"/>
    <text x="110" y="35" text-anchor="middle" class="label">Motion ingest</text>
    <text x="110" y="63" text-anchor="middle" class="small">rad/s and m/s²</text>
    <text x="110" y="86" text-anchor="middle" class="small">accel → gyro frame</text>
    <text x="110" y="109" text-anchor="middle" class="small">retain raw timestamps</text>
  </g>

  <g transform="translate(570 92)">
    <rect class="guard" width="220" height="108" rx="16"/>
    <text x="110" y="35" text-anchor="middle" class="label">Stereo queue</text>
    <text x="110" y="63" text-anchor="middle" class="small">bounded ownership</text>
    <text x="110" y="86" text-anchor="middle" class="small">IR1=0 · IR2=1</text>
  </g>
  <g transform="translate(570 292)">
    <rect class="guard" width="220" height="128" rx="16"/>
    <text x="110" y="35" text-anchor="middle" class="label">IMU sync</text>
    <text x="110" y="63" text-anchor="middle" class="small">bounded queues</text>
    <text x="110" y="86" text-anchor="middle" class="small">linear accel interpolation</text>
    <text x="110" y="109" text-anchor="middle" class="small">at gyro timestamps</text>
  </g>

  <g transform="translate(850 185)">
    <rect class="box" width="220" height="142" rx="16"/>
    <text x="110" y="38" text-anchor="middle" class="label">Ordered dispatcher</text>
    <text x="110" y="70" text-anchor="middle" class="small">sole OpenVINS writer</text>
    <text x="110" y="94" text-anchor="middle" class="small">IMU ≤ image time</text>
    <text x="110" y="118" text-anchor="middle" class="small">monotonic fail-closed</text>
  </g>

  <g transform="translate(1130 120)">
    <rect class="filter" width="230" height="105" rx="16"/>
    <text x="115" y="37" text-anchor="middle" class="label">Propagation</text>
    <text x="115" y="66" text-anchor="middle" class="small">RK4 IMU mean + covariance</text>
    <text x="115" y="88" text-anchor="middle" class="small">bias random walk</text>
  </g>
  <g transform="translate(1130 285)">
    <rect class="filter" width="230" height="105" rx="16"/>
    <text x="115" y="37" text-anchor="middle" class="label">MSCKF update</text>
    <text x="115" y="66" text-anchor="middle" class="small">stereo KLT constraints</text>
    <text x="115" y="88" text-anchor="middle" class="small">FEJ + chi-square gates</text>
  </g>

  <g transform="translate(850 475)">
    <rect class="output" width="510" height="95" rx="16"/>
    <text x="255" y="36" text-anchor="middle" class="label">State output</text>
    <text x="255" y="66" text-anchor="middle" class="small">pose · velocity · biases · covariance · global XYZ viewer/log</text>
  </g>

  <path class="line" d="M230 146H290"/>
  <path class="line" d="M230 356H290"/>
  <path class="line" d="M510 146H570"/>
  <path class="line" d="M510 356H570"/>
  <path class="line" d="M790 146C825 146 825 224 850 224"/>
  <path class="line" d="M790 356C825 356 825 286 850 286"/>
  <path class="line" d="M1070 225C1100 225 1100 173 1130 173"/>
  <path class="line" d="M1070 286C1100 286 1100 338 1130 338"/>
  <path class="line" d="M1245 225V285"/>
  <path class="line" d="M1245 390V475"/>

  <text x="700" y="602" text-anchor="middle" class="small">No detached threads · no ROS · no mapping · no loop closure · no depth/RGB processing</text>
</svg>

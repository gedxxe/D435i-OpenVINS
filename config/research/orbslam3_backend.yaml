%YAML:1.0
# Offline and isolated experimental-live research dependency pins. These
# entries do not replace or inject corrections into the live OpenVINS runtime.
format: "ovrs-orbslam3-backend-pin-v1"
backend_name: "ORB_SLAM3"
repository_url: "https://github.com/UZ-SLAMLab/ORB_SLAM3.git"
commit: "4452a3c4ab75b1cde34e5505a36ec3f9edcdc4c4"
license: "GPL-3.0-or-later"
runner: "Examples/Stereo-Inertial/stereo_inertial_euroc"
vocabulary: "Vocabulary/ORBvoc.txt"
patch: "patches/orbslam3-atlas-serialization-integrity.patch"
patch_sha256: "569daedf09fc13fe93d8e68eb2be3c389b21b031c949529f7b03469318eecc87"
imu_init_acceleration_threshold_m_s2: 0.5
live_minimum_stable_inertial_seconds: 3.0
live_maximum_tracking_interval_factor: 3.0
# A Tracking::OK pose is not canonical unless it also retains this many
# non-null tracked map points. The retained v26 continuity trace stayed above
# 139 after acceptance; 50 is deliberately conservative and is a continuity
# floor, not an accuracy certificate.
live_minimum_tracked_map_points: 50
# Reject finite but implausible pose jumps before they enter the canonical
# stream. The retained v26 accepted trace peaked at 0.384 m/s and 1.822 rad/s;
# these wider bounds are an operational continuity envelope, not measured
# platform dynamics or trajectory accuracy.
live_maximum_pose_linear_speed_m_s: 2.0
live_maximum_pose_angular_speed_rad_s: 6.0
# ORB-SLAM3 may discard an uninitialized map before any canonical pose exists.
# Bound those retries; every reset after trajectory acceptance remains fatal.
live_maximum_preacceptance_map_resets: 5
# Require one continuous low-motion IMU window before a canonical live pose
# can be accepted. The gravity-error bound itself comes from the selected
# estimator's existing max_accel_bias_m_s2 safety limit.
live_startup_stationary_seconds: 1.0
live_startup_stationary_timeout_seconds: 10.0
live_startup_maximum_acceleration_stddev_m_s2: 0.25
live_startup_maximum_gyro_magnitude_rad_s: 0.1
live_maximum_input_stall_seconds: 1.0
pangolin_repository_url: "https://github.com/stevenlovegrove/Pangolin.git"
pangolin_commit: "dd801d244db3a8e27b7fe8020cd751404aa818fd"
glew_repository_url: "https://github.com/Perlmint/glew-cmake.git"
glew_commit: "7574ab4d00b683e56adbfdec7da636529dfe65d8"

%YAML:1.0
# Diagnostic-only profile for measuring camera-IMU timestamp repeatability.
# Do not mix captures from this profile with Global Time captures.
width: 848
height: 480
camera_fps: 30
gyro_fps: 200
gyro_sensitivity: 1
gyro_scale_factor: 1.0
accelerometer_fps: 250
emitter_enabled: false
auto_exposure: true
motion_correction_enabled: true
global_time_enabled: false
imu_queue_size: 4096
stereo_queue_size: 32
stereo_tolerance_ms: 2.0
serial: ""
